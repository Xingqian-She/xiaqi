name: xiaqi

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: xiaqi/dev:latest
    init: true
    stdin_open: true
    tty: true
    gpus: all
    shm_size: 8gb
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace

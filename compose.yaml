name: xiaqi

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: &dev-image xiaqi/dev:latest
    entrypoint: []
    command: [/bin/bash]
    init: true
    stdin_open: true
    tty: true
    gpus: all
    shm_size: 8gb
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace

  tensorboard:
    image: *dev-image
    pull_policy: never
    profiles: [tensorboard]
    init: true
    entrypoint: [tensorboard]
    command: [--logdir, /logs, --host, 0.0.0.0, --port, "6006"]
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - type: bind
        source: ${XIAQI_TENSORBOARD_DIR:-./runs/smoke/tensorboard}
        target: /logs
        read_only: true
        bind:
          create_host_path: false
